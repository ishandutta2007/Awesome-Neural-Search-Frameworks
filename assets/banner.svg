<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Filter for Glow effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      /* Dynamic Animations */
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.35); opacity: 1; }
      }

      @keyframes flowVector {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes floatPill1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
      }

      @keyframes floatPill2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(-1.5deg); }
      }

      @keyframes floatPill3 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-7px) rotate(0.8deg); }
      }

      @keyframes waveSweep {
        0% { transform: translateX(-150px); opacity: 0.1; }
        50% { opacity: 0.35; }
        100% { transform: translateX(150px); opacity: 0.1; }
      }

      .node-pulse-1 { animation: pulseNode 3.5s ease-in-out infinite; transform-origin: 180px 100px; }
      .node-pulse-2 { animation: pulseNode 4.2s ease-in-out infinite 0.8s; transform-origin: 1020px 120px; }
      .node-pulse-3 { animation: pulseNode 3.8s ease-in-out infinite 1.6s; transform-origin: 960px 290px; }
      .node-pulse-4 { animation: pulseNode 4.5s ease-in-out infinite 2.2s; transform-origin: 140px 280px; }
      .node-pulse-5 { animation: pulseNode 3s ease-in-out infinite 1.1s; transform-origin: 320px 60px; }
      .node-pulse-6 { animation: pulseNode 4s ease-in-out infinite 2.5s; transform-origin: 880px 60px; }

      .vector-line {
        stroke-dasharray: 8 6;
        animation: flowVector 12s linear infinite;
      }

      .vector-line-reverse {
        stroke-dasharray: 6 8;
        animation: flowVector 15s linear infinite reverse;
      }

      .pill-1 { animation: floatPill1 5s ease-in-out infinite; }
      .pill-2 { animation: floatPill2 6s ease-in-out infinite 0.7s; }
      .pill-3 { animation: floatPill3 5.5s ease-in-out infinite 1.4s; }
      .pill-4 { animation: floatPill2 6.5s ease-in-out infinite 2.1s; }

      .radar-wave {
        animation: waveSweep 7s ease-in-out infinite alternate;
      }

      /* Clean typography */
      .banner-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: 2px;
      }

      .banner-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        letter-spacing: 0.5px;
      }

      .pill-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-weight: 600;
        font-size: 11px;
      }
    </style>
  </defs>

  <!-- 1. Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16"/>

  <!-- Radial ambiance glow -->
  <ellipse cx="600" cy="190" rx="420" ry="160" fill="url(#centerGlow)"/>

  <!-- 2. Dynamic Layer: Neural Graph & Search Vector Lattice (Background) -->
  <g opacity="0.38">
    <!-- Neural Vector Lines -->
    <line x1="140" y1="280" x2="180" y2="100" stroke="#38bdf8" stroke-width="1.5" class="vector-line"/>
    <line x1="180" y1="100" x2="320" y2="60" stroke="#818cf8" stroke-width="1.5" class="vector-line-reverse"/>
    <line x1="180" y1="100" x2="300" y2="210" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="4 4"/>
    <line x1="140" y1="280" x2="300" y2="210" stroke="#a855f7" stroke-width="1.2" class="vector-line"/>
    
    <line x1="1020" y1="120" x2="880" y2="60" stroke="#818cf8" stroke-width="1.5" class="vector-line"/>
    <line x1="1020" y1="120" x2="960" y2="290" stroke="#38bdf8" stroke-width="1.5" class="vector-line-reverse"/>
    <line x1="960" y1="290" x2="840" y2="220" stroke="#c084fc" stroke-width="1.2" class="vector-line"/>
    <line x1="880" y1="60" x2="840" y2="220" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="4 4"/>

    <!-- Cross Dimensional Connections -->
    <line x1="320" y1="60" x2="520" y2="40" stroke="#06b6d4" stroke-width="1" stroke-dasharray="3 5"/>
    <line x1="880" y1="60" x2="680" y2="40" stroke="#a855f7" stroke-width="1" stroke-dasharray="3 5"/>
    <line x1="300" y1="210" x2="450" y2="330" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 5"/>
    <line x1="840" y1="220" x2="750" y2="330" stroke="#c084fc" stroke-width="1" stroke-dasharray="3 5"/>
  </g>

  <!-- Dynamic Neural Nodes -->
  <g>
    <!-- Left Cluster Nodes -->
    <circle cx="180" cy="100" r="6" fill="#38bdf8" filter="url(#glow)" class="node-pulse-1"/>
    <circle cx="140" cy="280" r="5" fill="#a855f7" filter="url(#glow)" class="node-pulse-4"/>
    <circle cx="320" cy="60" r="4.5" fill="#818cf8" filter="url(#subtleGlow)" class="node-pulse-5"/>
    <circle cx="300" cy="210" r="4" fill="#06b6d4" opacity="0.8"/>
    
    <!-- Right Cluster Nodes -->
    <circle cx="1020" cy="120" r="6" fill="#38bdf8" filter="url(#glow)" class="node-pulse-2"/>
    <circle cx="960" cy="290" r="5.5" fill="#c084fc" filter="url(#glow)" class="node-pulse-3"/>
    <circle cx="880" cy="60" r="4.5" fill="#818cf8" filter="url(#subtleGlow)" class="node-pulse-6"/>
    <circle cx="840" cy="220" r="4" fill="#a855f7" opacity="0.8"/>

    <!-- Subtle Radar/Vector sweeps -->
    <ellipse cx="600" cy="190" rx="350" ry="120" fill="none" stroke="#6366f1" stroke-width="0.8" stroke-dasharray="6 12" class="radar-wave"/>
  </g>

  <!-- 3. Dynamic Floating Concept Pills (Kept strictly to margins to preserve central text clarity) -->
  <!-- Top Left Pill -->
  <g class="pill-1">
    <rect x="80" y="42" width="160" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.85"/>
    <circle cx="98" cy="57" r="4" fill="#38bdf8"/>
    <text x="110" y="61" fill="#e2e8f0" class="pill-text">⚡ Vector Search</text>
  </g>

  <!-- Bottom Left Pill -->
  <g class="pill-2">
    <rect x="75" y="318" width="170" height="30" rx="15" fill="#1e293b" stroke="#818cf8" stroke-width="1" opacity="0.85"/>
    <circle cx="93" cy="333" r="4" fill="#818cf8"/>
    <text x="105" y="337" fill="#e2e8f0" class="pill-text">🧠 Dense Embeddings</text>
  </g>

  <!-- Top Right Pill -->
  <g class="pill-3">
    <rect x="965" y="42" width="165" height="30" rx="15" fill="#1e293b" stroke="#c084fc" stroke-width="1" opacity="0.85"/>
    <circle cx="983" cy="57" r="4" fill="#c084fc"/>
    <text x="995" y="61" fill="#e2e8f0" class="pill-text">🌐 Multimodal AI</text>
  </g>

  <!-- Bottom Right Pill -->
  <g class="pill-4">
    <rect x="960" y="318" width="175" height="30" rx="15" fill="#1e293b" stroke="#06b6d4" stroke-width="1" opacity="0.85"/>
    <circle cx="978" cy="333" r="4" fill="#06b6d4"/>
    <text x="990" y="337" fill="#e2e8f0" class="pill-text">🎯 Hybrid BM25 + HNSW</text>
  </g>

  <!-- 4. Foreground Content (Main Title, Subtitle, Key Metadata) -->
  <!-- High contrast background scrim for the text block ensures 100% legibility in all contexts -->
  <g id="foreground-text">
    <!-- Supertag Pill -->
    <g transform="translate(470, 75)">
      <rect x="0" y="0" width="260" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2"/>
      <circle cx="16" cy="14" r="4" fill="#38bdf8" filter="url(#subtleGlow)"/>
      <text x="28" y="18" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" letter-spacing="1.5">ENTERPRISE RETRIEVAL &amp; RAG</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="155" text-anchor="middle" fill="url(#textGrad)" class="banner-title" font-size="37" filter="url(#subtleGlow)">AWESOME NEURAL SEARCH</text>
    <text x="600" y="196" text-anchor="middle" fill="#ffffff" class="banner-title" font-size="28" letter-spacing="3">FRAMEWORKS &amp; ENGINES</text>

    <!-- Subtitle -->
    <text x="600" y="240" text-anchor="middle" fill="#94a3b8" class="banner-sub" font-size="15">
      Curated Ecosystem for Multimodal Indexing, Cloud-Native Vector Retrieval &amp; Semantic RAG
    </text>

    <!-- Decorative Accent Divider -->
    <rect x="475" y="260" width="250" height="2" rx="1" fill="url(#accentGrad)"/>

    <!-- Bottom Feature Badges / Highlights -->
    <g transform="translate(340, 280)">
      <text x="260" y="12" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500" letter-spacing="0.5">
        🚀 Vector Databases <tspan fill="#6366f1">•</tspan> 🔍 Neural Ranking <tspan fill="#6366f1">•</tspan> 📦 Hybrid Retrieval <tspan fill="#6366f1">•</tspan> 🤖 Agent Orchestration
      </text>
    </g>
  </g>
</svg>
